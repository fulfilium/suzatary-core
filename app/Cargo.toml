# THE APPLICATION'S WORKSPACE (docs/ARCHITECTURE.md), the repository's only one; the Prodrome
# is a dependency by REVISION (→ `prodromedependency`). Arrows point down only: cli → plugin →
# io → core → {todo → signatures, memory → held, services → {held, health}, {health, triage} → mail → {held, signatures}} →
# store, record → base → prodrome-core.
# `wasm` is the browser's module; `plugin` the plugin host, alone because wasmtime is the largest
# tree here; `plugin-fence` a hostile plugin the flake builds for wasm32; `testkit` the programs
# `io`'s and `cli`'s tests run.
[workspace]
resolver = "3"
members = ["base", "record", "release", "store", "signatures", "todo", "held", "memory", "mail", "health", "triage", "services", "google", "connect", "inbox", "conversations", "lines", "topics", "digest", "cards", "secretary", "api", "io", "cli", "wasm", "plugin", "plugin-fence", "plugin-ics", "testkit", "viewtree", "pages"]

[workspace.package]
# FIXED, NOT THE RELEASE: the binary reads `app/release.toml` at run time, and a version here
# would move every crate's inputs on every train.
version = "0.0.0"
# `rust-version` is the toolchain the flake ships, the only one there is.
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Renamed from `prodrome`, its `[lib] name`, so the code spells it one way. ⚠️ BY REVISION,
# NEVER BY BRANCH: the three `rev`s here, `app/Cargo.lock`, `flake.nix`'s `inputs.prodrome.url`
# and `flake.lock` move together, ONE sha, so the binary and the browser's wasm read SPEC.md
# alike. ⚠️ No default features: the reference payload is not linked; the record is ours.
prodrome_core = { package = "prodrome-core", git = "https://github.com/fulfilium/prodrome", rev = "799cffb1232f6eb62bb3c669400f002260d018ab", default-features = false }
# The Prodrome's exports generic over a schema, which `wasm` instantiates at this application's.
prodrome-wasm-exports = { git = "https://github.com/fulfilium/prodrome", rev = "799cffb1232f6eb62bb3c669400f002260d018ab" }
suzatary-base = { path = "base" }
suzatary-record = { path = "record" }
suzatary-release = { path = "release" }
suzatary-store = { path = "store" }
suzatary-signatures = { path = "signatures" }
suzatary-todo = { path = "todo" }
suzatary-held = { path = "held" }
suzatary-memory = { path = "memory" }
suzatary-mail = { path = "mail" }
suzatary-health = { path = "health" }
suzatary-triage = { path = "triage" }
suzatary-services = { path = "services" }
suzatary-google = { path = "google" }
suzatary-connect = { path = "connect" }
suzatary-inbox = { path = "inbox" }
suzatary-conversations = { path = "conversations" }
suzatary-lines = { path = "lines" }
suzatary-topics = { path = "topics" }
suzatary-digest = { path = "digest" }
suzatary-cards = { path = "cards" }
suzatary-secretary = { path = "secretary" }
suzatary-api = { path = "api" }
suzatary-io = { path = "io" }
suzatary-plugin = { path = "plugin" }
# The evaluator's time type; "serde" for a changeset act's stored `Priority::Deadline`.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# The owner's zone by name (`suzatary_base::zone`), the database the calendar plugin reads.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
thiserror = "2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- THE SERVER. ⚠️ ONE rustls with `ring`, NEVER OpenSSL: `aws-lc-rs` wants cmake and Go in
# the offline Nix build, and two crypto providers are two things to keep patched.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# The runtime, HERE AND NOWHERE ELSE.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# web/dist served as files, compressed.
tower-http = { version = "0.7", features = ["fs", "compression-br", "compression-gzip", "set-header"] }
# `no-provider`, so the provider is chosen once, above.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The instance file; only the binary parses it.
toml = "0.9"
# The one place `instance.toml` is EDITED, keeping every comment, when a tapped card adds a table.
toml_edit = "0.22"
# The binary's edge only; a library returns typed errors.
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ONE BLOCKING HTTP CLIENT, for FCM and ntfy: `Notify::push` is sync; no second runtime.
# `webpki-roots`, not the platform's store.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# THE PLUGIN RUNTIME: the component model under cranelift, no other default.
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
# Preview 2: clocks, randomness, streams and environment, never a filesystem or a socket.
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
# The guest side of the same worlds, for `plugin-fence`.
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc", "std"] }
webpki-roots = "1"
# The push service account's RS256 JWT; `rust_crypto` for the reason above.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# The maildir files: RFC 2047 words, address lists and dates. notmuch stays a SUBPROCESS.
mail-parser = "0.11"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# The system's random generator, already in the tree under `rustls`.
ring = "0.17"
base64 = "0.22"
# THE ONE AEAD (`secretary::locked_text`), pure Rust: the box and the tab open with one function;
# a key is drawn through `Entropy`.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# A dropped key's bytes are overwritten.
zeroize = { version = "1", default-features = false }
# A held replica's snapshot (`suzatary_store::snapshot`), binary and without field names.
postcard = { version = "1", default-features = false, features = ["alloc"] }
regex = "1"
# Unicode's word characters for the scrub's ASCII copy (`redact`), the version `regex` links.
regex-syntax = "0.8"
# --- THE AGENT'S TOOLS. The official MCP SDK, PINNED, with `server` and `transport-io` only:
# no macros (the verb table is data), no HTTP, no client.
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-io"] }
# A verb's input schema is DERIVED from its argument type.
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }

# --- MAIL. ⚠️ ONE rustls, STILL: `lettre`'s is the same 0.23 with `ring`; `imap` takes NO tls
# feature (it pins 0.22), and `suzatary_io::imap` hands it a stream our rustls built.
imap = { version = "3.0.0-alpha.15", default-features = false }
# SMTP with XOAUTH2 and STARTTLS, Microsoft's path (Proton Bridge's CA-marked certificate is
# pinned in `suzatary_io::smtp::submission`). No `builder`: the MIME is the pure core's.
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "rustls-tls",
  "hostname",
] }
# THE MIME, by `mail-parser`'s authors, so what is written and what is read agree.
mail-builder = { version = "0.5", default-features = false }

# THE TYPESCRIPT IS GENERATED FROM THE RUST: a second declaration drifts.
ts-rs = "11"

# TYPST'S OWN PARSER, pinned to `.#triage`'s `typst`: one reading of the language.
typst-syntax = "=0.15.1"
# THE CLOSED WORLD authored markup compiles in: the Prodrome's typst-wasm without `html` and
# `plugin`, the crate the tab fetches, at `prodrome_core`'s revision.
prodrome-typst-wasm = { git = "https://github.com/fulfilium/prodrome", rev = "799cffb1232f6eb62bb3c669400f002260d018ab", default-features = false }
# THE FACES A DRAWING IS SET IN (`prodrome draw`): typst's own, at the typst this lock links, in
# the binary, so no font the machine holds reaches a picture.
typst-assets = { version = "=0.15.1", features = ["fonts"] }

# CLIPPY PEDANTIC IS ON, AND EACH ALLOW SAYS WHY.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Each typed error's `#[error(..)]` says what went wrong; an `# Errors` section would restate it.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rust]
missing_docs = "allow"

# THE TEST BUILD IS NOT A DEBUGGER SESSION: full debuginfo fills the disk (→ `checkdisk`). Line
# tables keep a panic's file and line.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Dependencies optimised, the workspace's own crates not: the tests spend their time in the
# dependencies.
[profile.dev.package."*"]
opt-level = 1

# Every write verifies signatures, and an unoptimised Ed25519 check costs milliseconds.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# THE DEPLOYED BINARY (`.#suzatary`): small; sixteen units, faster to build than one; no LTO,
# which grew it or slowed the rebuild; a handler's panic unwinds, ending its task and not the
# server.
[profile.release]
opt-level = "s"
codegen-units = 16
strip = "symbols"

# THE BROWSER'S BUILD (`wasm/`): the one artefact whose size a reader pays, so whole-program LTO
# and `abort`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"

# The gate's tests' and scenes' build of it (`-dev`): no LTO, half the compile.
[profile.wasm-dev]
inherits = "wasm-release"
codegen-units = 16
lto = false
