# THE APPLICATION'S WORKSPACE (docs/ARCHITECTURE.md), the only one in the repository. The
# Prodrome is the database, a dependency by REVISION (→ `prodromedependency`).
#
# Arrows point down only: cli → plugin → io → core → store, record → base → prodrome-core.
# `wasm` is the browser's module, depended on by nothing. `plugin` is the plugin host
# (docs/PLUGINS-PLAN-2026-10-02.md), its own crate because wasmtime is the largest tree here.
# `plugin-fence` is a hostile plugin the flake builds for wasm32 and the workspace only lints.
# `testkit` is a dev-dependency of `io` and `cli`: the programs their tests run.
[workspace]
resolver = "3"
members = ["base", "record", "store", "core", "api", "io", "cli", "wasm", "plugin", "plugin-fence", "plugin-ics", "testkit", "viewtree", "pages"]

[workspace.package]
# FIXED, AND NOT THE RELEASE (CLAUDE.md, "Versioning"): the binary reads `app/release.toml` at
# run time, and a version here would move every crate's inputs on every train.
version = "0.0.0"
# `rust-version` is the toolchain the flake ships, the only one there is.
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The package is `prodrome-core`, its `[lib] name` `prodrome`; renamed so the code and
# ARCHITECTURE spell it one way.
#
# ⚠️ BY REVISION, NEVER BY BRANCH. Moving the pin edits the three `rev`s here,
# `app/Cargo.lock`, `flake.nix`'s `inputs.prodrome.url` and `flake.lock` together: ONE sha,
# because the crate the binary links and the wasm the browser fetches must read SPEC.md alike.
#
# ⚠️ `default-features = false` TURNS OFF THE REFERENCE PAYLOAD: this application's record is
# `suzatary_record::record::Record`, so the example is not linked.
prodrome_core = { package = "prodrome-core", git = "https://github.com/fulfilium/prodrome", rev = "a0e99598eb61866c447f386dcb75557b0520dad4", default-features = false }
# The Prodrome's exports generic over a schema, which `wasm` instantiates at this application's.
prodrome-wasm-exports = { git = "https://github.com/fulfilium/prodrome", rev = "a0e99598eb61866c447f386dcb75557b0520dad4" }
suzatary-base = { path = "base" }
suzatary-record = { path = "record" }
suzatary-store = { path = "store" }
suzatary-core = { path = "core" }
suzatary-api = { path = "api" }
suzatary-io = { path = "io" }
suzatary-plugin = { path = "plugin" }
# The evaluator's time type; "serde" because a changeset act's `Priority::Deadline` is stored
# as JSON, and there is one date type.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# The owner's zone by name (`suzatary_base::zone`), the database the calendar plugin reads.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
thiserror = "2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- THE SERVER.
#
# ⚠️ rustls AND NEVER OpenSSL. Everything that touches TLS resolves to ONE rustls with the
# `ring` provider: `aws-lc-rs` wants cmake and Go in the offline Nix build, and two crypto
# providers in one binary are two things to keep patched.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# The runtime, HERE AND NOWHERE ELSE.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# web/dist served as files, compressed.
tower-http = { version = "0.7", features = ["fs", "compression-br", "compression-gzip", "set-header"] }
# `no-provider`, so the provider is chosen once, above.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The instance file; only the binary parses it.
toml = "0.9"
# THE ONE PLACE `instance.toml` IS EDITED RATHER THAN REWRITTEN: it keeps every comment, so a
# tapped card adds a table without disturbing the rest of the file.
toml_edit = "0.22"
# The binary's edge only; a library returns typed errors.
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ONE BLOCKING HTTP CLIENT, for FCM and ntfy: `Notify::push` is sync, and ureq brings no second
# runtime. `webpki-roots` rather than the platform's store.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# THE PLUGIN RUNTIME (`suzatary-plugin`): the component model under cranelift, and none of
# wasmtime's other defaults.
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
# Preview 2 only: the host links clocks, random numbers, streams and environment, never a
# filesystem or a socket.
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
# The guest side of the same worlds, for `plugin-fence`.
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc", "std"] }
webpki-roots = "1"
# The push service account's RS256 JWT; `rust_crypto` for the reason above.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# The maildir files: RFC 2047 words, address lists and dates. notmuch stays a SUBPROCESS.
mail-parser = "0.11"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# The system's random generator, already in the tree under `rustls`.
ring = "0.17"
base64 = "0.22"
# THE ONE AEAD (`secretary::locked_text`): ChaCha20-Poly1305, pure Rust, so the box and the
# tab's wasm open with one function; a key is drawn through `Entropy`.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# A dropped key's bytes are overwritten.
zeroize = { version = "1", default-features = false }
# A held replica's snapshot (`suzatary_core::snapshot`), binary and without field names.
postcard = { version = "1", default-features = false, features = ["alloc"] }
regex = "1"
# Unicode's word characters for the scrub's ASCII copy (`redact`), the version `regex` links.
regex-syntax = "0.8"
# --- THE AGENT'S TOOLS. The official MCP SDK, PINNED, with `server` and `transport-io` only:
# no macros (the verb table is data), no HTTP, no client.
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-io"] }
# A verb's input schema is DERIVED from its argument type.
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }

# --- MAIL.
#
# ⚠️ ONE rustls, STILL. `lettre`'s `rustls-tls` is the same rustls 0.23 with `ring`. `imap`
# takes NO tls feature (its `rustls-tls` pins rustls 0.22): `suzatary_io::imap` hands it a stream
# this workspace's own rustls built.
imap = { version = "3.0.0-alpha.15", default-features = false }
# SMTP with XOAUTH2 and STARTTLS, Microsoft's send path. Not Proton Bridge's: its self-signed
# certificate is marked a CA, so `suzatary_io::smtp::submission` speaks to it over a pinned
# certificate. No `builder`: the MIME is the core's, because it is pure.
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "rustls-tls",
  "hostname",
] }
# THE MIME, in the pure core, by the authors of `mail-parser`, so what is written and what is
# read agree.
mail-builder = { version = "0.5", default-features = false }

# THE TYPESCRIPT IS GENERATED FROM THE RUST: a second declaration drifts.
ts-rs = "11"

# TYPST'S OWN PARSER, PINNED TO THE `typst` THE `.#triage` SHELL CARRIES, so there is one
# reading of the language.
typst-syntax = "=0.15.1"
# THE CLOSED WORLD authored markup compiles in: the Prodrome's typst-wasm, without `html` and
# `plugin`, the same crate the tab fetches as WebAssembly. The same revision as
# `prodrome_core`; no default features.
prodrome-typst-wasm = { git = "https://github.com/fulfilium/prodrome", rev = "a0e99598eb61866c447f386dcb75557b0520dad4", default-features = false }

# CLIPPY PEDANTIC IS ON, AND EACH ALLOW SAYS WHY.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Each typed error's `#[error(..)]` says what went wrong; an `# Errors` section would restate it.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rust]
missing_docs = "allow"

# THE TEST BUILD IS NOT A DEBUGGER SESSION: full debuginfo made a test tree of 9–16 GB (→
# `checkdisk`). Line tables keep a panic's file and line.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Dependencies optimised, the workspace's own crates not: the tests spend their time in the
# dependencies (on the 4-core gate machine, 2026-10-11, 112 s against 173).
[profile.dev.package."*"]
opt-level = 1

# Every write verifies signatures, and an unoptimised Ed25519 check costs milliseconds.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# THE DEPLOYED BINARY (`.#suzatary`), measured 2026-10-04 (PR #72). `opt-level = "s"` for a
# small binary; sixteen codegen units (a core change rebuilt in 252 s against 340 with one); LTO
# off (thin grew the binary, fat cost six times the rebuild); `panic` unwinds, so a handler's
# panic ends its task and not the server.
[profile.release]
opt-level = "s"
codegen-units = 16
strip = "symbols"

# THE BROWSER'S BUILD (`wasm/`): the one artefact whose size a reader pays, so whole-program LTO
# and `abort`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
