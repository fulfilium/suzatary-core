[package]
name = "suzatary-core"
description = "Suzatary's meaning, pure (see ../../docs/ARCHITECTURE.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
name = "suzatary_core"
path = "src/lib.rs"

[dependencies]
prodrome_core.workspace = true
suzatary-base.workspace = true
suzatary-record.workspace = true
suzatary-store.workspace = true
suzatary-signatures.workspace = true
suzatary-todo.workspace = true
suzatary-held.workspace = true
suzatary-memory.workspace = true
suzatary-mail.workspace = true
suzatary-health.workspace = true
suzatary-triage.workspace = true
suzatary-services.workspace = true
suzatary-google.workspace = true
suzatary-connect.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# The release plan and what a version completed are TOML the train writes and the build reads.
toml.workspace = true
schemars.workspace = true
ts-rs.workspace = true
# The sweep reads a code out of a message (`secretary::sweep::candidates`).
regex.workspace = true
# A topic's text is NFC (`secretary::topics::topic`).
unicode-normalization = "0.1"
# A sealed slot's box and a line's literal (`secretary::line_event`), and PKCE's verifier.
base64.workspace = true
# A window's arithmetic, on `prodrome::fpl::Instant`: the chrono prodrome-core takes.
chrono.workspace = true
# The owner's day is read in a NAMED zone, so daylight saving is the zone's rule.
chrono-tz.workspace = true
# Typst's own parser reads a write's block back before it is written.
typst-syntax.workspace = true
# The hashes prodrome-core uses.
sha2.workspace = true
hex.workspace = true
postcard.workspace = true

# How the inbox's schema crosses into the browser's module (`secretary::inbox_json`): the
# exports' `Json` is implemented beside the type, which a module crate could not do.
prodrome-wasm-exports = { workspace = true, optional = true }

[features]
# Inert effects a test fills a record from; never in the shipped build.
nothing = ["suzatary-base/nothing", "suzatary-record/nothing", "suzatary-store/nothing", "suzatary-signatures/nothing", "suzatary-todo/nothing", "suzatary-held/nothing", "suzatary-memory/nothing", "suzatary-mail/nothing", "suzatary-health/nothing", "suzatary-triage/nothing", "suzatary-services/nothing", "suzatary-google/nothing", "suzatary-connect/nothing"]
# The e2e fixture's scripted person (`secretary::Speaker::scripted`); `suzatary`'s `fixture` alone.
fixture = []
# The browser module's view of this crate's schemas; `app/wasm` alone enables it.
wasm = ["dep:prodrome-wasm-exports"]

[dev-dependencies]
suzatary-core = { path = ".", features = ["nothing"] }
# The laws are properties over arbitrary strings.
proptest.workspace = true
# A plugin's manifest is read as the instance file spells it.
toml.workspace = true

[lints]
workspace = true

# ONE TEST BINARY (`autotests = false` above): every file under `tests/` is a
# module of `tests/all.rs`, so the suite links the application once, not per file.
[[test]]
name = "all"
path = "tests/all.rs"
