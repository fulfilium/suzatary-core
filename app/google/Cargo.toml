[features]
nothing = ["suzatary-base/nothing", "suzatary-store/nothing", "suzatary-todo/nothing", "suzatary-mail/nothing", "suzatary-services/nothing"]

[dev-dependencies]
suzatary-google = { path = ".", features = ["nothing"] }
