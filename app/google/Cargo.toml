license.workspace = true

[lib]
name = "suzatary_google"
path = "src/lib.rs"

[dependencies]
prodrome_dag.workspace = true
prodrome_data.workspace = true
prodrome_declared.workspace = true
suzatary-base.workspace = true
suzatary-store.workspace = true
suzatary-todo.workspace = true
suzatary-mail.workspace = true
suzatary-address.workspace = true
suzatary-services.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
