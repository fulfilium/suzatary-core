[package]
name = "suzatary-signatures"
description = "Suzatary's signatures, trust and chain set (see ../../docs/CORESPLIT-PLAN-2026-11-06.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "suzatary_signatures"
path = "src/lib.rs"

[dependencies]
prodrome_core.workspace = true
suzatary-base.workspace = true
suzatary-record.workspace = true
suzatary-store.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
chrono.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true

[features]
nothing = ["suzatary-base/nothing", "suzatary-record/nothing", "suzatary-store/nothing"]

[dev-dependencies]
suzatary-signatures = { path = ".", features = ["nothing"] }
proptest.workspace = true

[lints]
workspace = true
