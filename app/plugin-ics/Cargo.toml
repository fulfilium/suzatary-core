[package]
name = "suzatary-plugin-ics"
description = "The app's reference calendar plugin: a source component that reads secret iCal links and emits one item per event occurrence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false
publish = false

# A plain library here, so the workspace's native build tests and lints the calendar logic like
# any other crate. The component is this library built as a `cdylib` for wasm32-wasip2.
[lib]
name = "suzatary_plugin_ics"
path = "src/lib.rs"

[dependencies]
chrono.workspace = true
# The IANA database, compiled in: a TZID that names a zone is resolved here, never by asking
# the host's system.
chrono-tz.workspace = true
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
iso8601 = "0.6"
prodrome_core.workspace = true
rrule = "0.14"
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
proptest.workspace = true
# The host's own door for an item, so the tests ask the reader that stores it.
suzatary-core = { workspace = true, features = ["nothing"] }

[lints]
workspace = true

# ONE TEST BINARY (`autotests = false` above): every file under `tests/` is a
# module of `tests/all.rs`, so the suite links the application once, not per file.
[[test]]
name = "all"
path = "tests/all.rs"
