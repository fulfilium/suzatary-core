[package]
name = "suzatary-bench"
description = "TRIAGEBENCH's case types, extraction and the runner behind `suzatary-dev bench extract|run` (see ../../docs/TRIAGEBENCH-PLAN-2026-09-19.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "suzatary_bench"
path = "src/lib.rs"

[dependencies]
# The database's own hash/id/actor newtypes and event shapes — a case names
# them exactly as the chain does, never through a second spelling.
prodrome_core.workspace = true
# `suzatary_core::record` (the application's payload, `TodoEvent`/`Envelope`
# over it), `suzatary_core::mail::state` (`state.json`'s value) and
# `suzatary_core::secretary::store` (a conversation's `Entry`/`Proposal`) are
# the three sources §2 of the plan names; this crate reads their TYPES and
# writes none of its own for the same data (COMMIT 1's "never invent a second
# reader").
suzatary-core = { path = "../core" }
thiserror.workspace = true
# A frozen message's bytes, which need not be UTF-8, in the case file's JSON.
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
# `select::rank`'s deterministic ordering — the same digest, not a second
# hash, every other seeded-selection in this repository reaches for
# (`capability::model::SessionId::minted`).
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
suzatary-core = { path = "../core", features = ["nothing"] }

[lints]
workspace = true
