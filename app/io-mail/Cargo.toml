[package]
name = "suzatary-io-mail"
description = "Suzatary's mail transports: IMAP, SMTP, the Gmail API and OAuth, the pullers and their sync, the junk sweep, the older search and the notmuch corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
name = "suzatary_io_mail"
path = "src/lib.rs"

[dependencies]
suzatary-os.workspace = true
suzatary-io-access.workspace = true
suzatary-io-local.workspace = true
suzatary-io-chains.workspace = true
suzatary-base.workspace = true
suzatary-store.workspace = true
suzatary-held.workspace = true
suzatary-mail.workspace = true
suzatary-health.workspace = true
suzatary-triage.workspace = true
suzatary-google.workspace = true
prodrome_core.workspace = true
chrono.workspace = true
thiserror.workspace = true
# The JSON this crate parses: notmuch's output and the Gmail API's answers.
serde.workspace = true
serde_json.workspace = true
# The roots IMAP trusts.
webpki-roots.workspace = true
base64.workspace = true
# The maildir files notmuch names, and the sha256 their headers reduce to.
mail-parser.workspace = true
sha2.workspace = true
hex.workspace = true
# The Gmail API's search query, percent-encoded into its URL.
percent-encoding = "2"
# The html-to-text walk over a body.
regex.workspace = true
# --- THE MAIL TRANSPORTS (§8.6).
# IMAP, with no TLS feature of its own: the stream is built here, from the workspace's rustls.
imap.workspace = true
# The TLS both mail transports run over, and the roots they trust.
# `webpki-roots`, not the platform store: a systemd unit's view of /etc/ssl is one more thing
# to be wrong about. The Proton Bridge path trusts no store: its verifier accepts ONE pinned
# self-signed certificate and nothing else (`smtp::submission`).
rustls.workspace = true
rustls-pki-types = "1"
# SMTP + XOAUTH2 + STARTTLS, for Microsoft. The Bridge's SMTP is spoken by hand,
# because lettre cannot take a verifier of our own.
lettre.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The conformance suites the pullers and the transports are run against.
suzatary-connect.workspace = true
# Programs a test makes and runs, never executing a file its process wrote.
suzatary-testkit = { path = "../testkit" }
# A test's private scratch directory.
tempfile = "3"

# ONE TEST BINARY (`autotests = false` above): every file under `tests/` is a
# module of `tests/all.rs`, so the suite links the application once, not per file.
[[test]]
name = "all"
path = "tests/all.rs"
