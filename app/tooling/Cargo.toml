[package]
name = "suzatary-tooling"
description = "The merge train's typed program: its verdict table, and the publication of its landed commits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "suzatary_tooling"
path = "src/lib.rs"

[[bin]]
name = "train"
path = "src/main.rs"

[features]
# The test seams of the guards (`SUZATARY_TRAIN_*`); the train's own build compiles none of them.
seams = []

# No workspace member: the train never links code of a tree it judges (law 9, tests/laws.rs).
[dependencies]
# A child's process group signalled, waited for and reaped as a group, safely (the runner).
rustix = { version = "1", features = ["event", "process"] }
# HUP, INT and TERM received as messages, whatever disposition the train inherited.
signal-hook = "0.4"
thiserror.workspace = true
# The context budget (`context`): context.toml read and edited, Rust and Cargo manifests read.
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "laws"
path = "tests/laws.rs"

[[test]]
name = "publication"
path = "tests/publication.rs"

[[test]]
name = "gating"
path = "tests/gating.rs"

[lints]
workspace = true
