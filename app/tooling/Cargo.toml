[package]
name = "suzatary-tooling"
description = "The merge train's typed program: its verdict table, read and written as train.sh stores it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "suzatary_tooling"
path = "src/lib.rs"

[[bin]]
name = "train"
path = "src/main.rs"

[features]
# The test seams of the guards (`SUZATARY_TRAIN_*`); the train's own build compiles none of them.
seams = []

# No workspace member: the train never links code of a tree it judges (law 9, tests/laws.rs).
[dependencies]
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "laws"
path = "tests/laws.rs"

[lints]
workspace = true
