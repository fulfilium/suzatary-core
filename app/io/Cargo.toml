[package]
name = "suzatary-io"
description = "Suzatary's interpreters: the capabilities of its model crates, against the world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
name = "suzatary_io"
path = "src/lib.rs"

[dependencies]
suzatary-os.workspace = true
suzatary-io-access.workspace = true
suzatary-io-local.workspace = true
suzatary-io-mail.workspace = true
suzatary-base.workspace = true
suzatary-store.workspace = true
suzatary-signatures.workspace = true
suzatary-held.workspace = true
suzatary-memory.workspace = true
suzatary-services.workspace = true
suzatary-google.workspace = true
suzatary-cards.workspace = true
suzatary-inbox.workspace = true
suzatary-secretary.workspace = true
chrono.workspace = true
thiserror.workspace = true
# The JSON this crate parses: the FCM message.
serde.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
hex.workspace = true

[lints]
workspace = true

[dev-dependencies]
suzatary-io-chains.workspace = true
suzatary-connect.workspace = true
# Programs a test makes and runs, never executing a file its process wrote.
suzatary-testkit = { path = "../testkit" }
# A test's private scratch directory.
tempfile = "3"

# ONE TEST BINARY (`autotests = false` above): every file under `tests/` is a
# module of `tests/all.rs`, so the suite links the application once, not per file.
[[test]]
name = "all"
path = "tests/all.rs"
