[package]
name = "suzatary-triage"
description = "Suzatary's triage: what the box decided about each message, and the rules it runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "suzatary_triage"
path = "src/lib.rs"

[dependencies]
prodrome_core.workspace = true
suzatary-base.workspace = true
suzatary-store.workspace = true
suzatary-held.workspace = true
suzatary-mail.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true

[features]
nothing = ["suzatary-base/nothing", "suzatary-store/nothing", "suzatary-held/nothing", "suzatary-mail/nothing"]

[dev-dependencies]
suzatary-triage = { path = ".", features = ["nothing"] }
proptest.workspace = true

[lints]
workspace = true
