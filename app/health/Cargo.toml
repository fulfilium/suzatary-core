version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "suzatary_health"
path = "src/lib.rs"

[dependencies]
prodrome_data.workspace = true
suzatary-base.workspace = true
suzatary-store.workspace = true
suzatary-mail.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
chrono.workspace = true

[features]
nothing = ["suzatary-base/nothing", "suzatary-store/nothing", "suzatary-mail/nothing"]

[dev-dependencies]
suzatary-health = { path = ".", features = ["nothing"] }
proptest.workspace = true

[lints]
workspace = true
