[layers]
# The cuts of `app/core/src`, bottom first: a module may name its own cut's and lower cuts'
# modules, never a higher one's. A file is in the cut of the longest module path below that
# holds it. A cut that is its own crate (`app/base`, `app/record`, `app/api`) is held by the
# compiler. The guard layers.rs beside this file reads it; the core split's plan
# (docs/CORESPLIT-PLAN-2026-11-06.md) says why each module is where it is.
order = ["store", "signatures", "todo", "held", "memory", "mail", "health", "triage", "services", "google", "connect", "inbox", "conversations", "lines", "topics", "digest", "cards", "secretary", "api"]
# The edges that still point up, each named in the core split's plan; the list only shrinks. Each
# entry is an inline table, so no two names stand in the `"a", "b"` shape the leak guard's
# generic-api-key rule reads as a key and its value.
allowed = [
  { from = "reading", to = "calendar" },
  { from = "secretary/build", to = "secretary" },
  { from = "secretary/erasure", to = "secretary/holder" },
  { from = "secretary/filed", to = "secretary" },
  { from = "secretary/held_lines", to = "secretary/digest" },
  { from = "secretary/mail_health", to = "secretary" },
  { from = "secretary/mail_health", to = "secretary/verbs" },
  { from = "secretary/memories", to = "secretary/filed" },
  { from = "secretary/opened", to = "secretary/digest" },
  { from = "secretary/opened", to = "secretary/held_lines" },
  { from = "secretary/opened", to = "secretary/line_event" },
  { from = "secretary/readings", to = "secretary" },
  { from = "secretary/title", to = "secretary" },
  { from = "secretary/undo", to = "secretary" },
]

# The sources `rendering.rs` hashes into every kept render's name, by SHA-256. A change to one
# renames every kept render: say so in the pull request, then set its digest here.
rendering = [
  { file = "../../base/src/answer.rs", sha256 = "07abc4cd96b944c141c24b79af90a20d2bf453ea41568fc5a4307556b3ecfafb" },
  # `app/base` allows `narrowing.rs` its broken doc link to `rendering`, a crate above it, so
  # the file stays byte-identical. The allow goes when this key next changes for its own reason.
  { file = "../../base/src/narrowing.rs", sha256 = "1b99ffa5ec4339ebf355375cba493b6ace81105febc60dbbbdbc14f8cf5825d7" },
  { file = "rendering/answer.typ", sha256 = "8dd0591f6360b6571210e9ca86627ce5e5b8dfe911165ab91c21ac8b5b4accee" },
  { file = "rendering/calendar.typ", sha256 = "dbb5a542d089d3e6a33c93aaaf9aee1e3328490e99c88beeb78855dc61ffc313" },
  { file = "rendering/decisions.typ", sha256 = "fc82d41babf85349bb8dbb31f8e8c9c57ac1256a0f6068ae65e409fad2a49294" },
  { file = "rendering/markup.typ", sha256 = "584e04ebd82a4de7e1f7fc480e981641be1f59fea67b63561188833b6a0f92e3" },
  { file = "rendering/page.typ", sha256 = "6026dca27037a3f4136ef1b98812994481255ff7e273174068ca50862f1fc62c" },
  { file = "../../base/src/tripwire.rs", sha256 = "7dc746a1b9202ce6ec2551799a2745a263e04253b553571b830cc124c1c67f00" },
]

