[package]
name = "suzatary"
description = "Suzatary: serve | mcp | sync | web | todo (see ../../docs/ARCHITECTURE.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false
# `suzatary-dev` (the fixture's binary) sits beside it, so `cargo run -p suzatary` names this one.
default-run = "suzatary"

# A LIBRARY BESIDE THE BINARY, so the binary's own wiring can be tested: cargo
# links `tests/*.rs` against a package's library, and a package with only a
# `[[bin]]` exposes nothing to them. See `src/lib.rs` for why that mattered.
[lib]
name = "suzatary_cli"
path = "src/lib.rs"

[[bin]]
name = "suzatary"
path = "src/main.rs"

# THE DEVELOPMENT BINARY: every verb of `suzatary`, plus
# `fixture-chain`, `fixture-triage`, `fake-google` and `guide`. It needs the `fixture` feature, so a
# build without it (`nix build .#suzatary`, the units' program) never compiles
# it, and the deployed binary's argument tree has none of those verbs.
[[bin]]
name = "suzatary-dev"
path = "src/bin/suzatary-dev.rs"
required-features = ["fixture"]

[dependencies]
suzatary-base.workspace = true
suzatary-record.workspace = true
suzatary-store.workspace = true
suzatary-signatures.workspace = true
suzatary-core.workspace = true
suzatary-api.workspace = true
suzatary-io.workspace = true
# The plugin host: `suzatary plugin sync` runs the `[[plugins]]` sources.
suzatary-plugin.workspace = true
prodrome_core.workspace = true
clap = { version = "4", features = ["derive"] }
# THE AGENT'S TOOLS, over stdio (§8.4).
rmcp.workspace = true
# THE RUNTIME AND THE ROUTES LIVE HERE AND NOWHERE ELSE (§2).
axum.workspace = true
axum-server.workspace = true
rustls.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The instance file, and the wire this serialises.
toml.workspace = true
# THE ONE EDIT PATH: `instance::InstanceEdits` parses the file as a
# `DocumentMut` and edits one table, never rewriting the rest of it — see
# `toml_edit`'s own comment in the workspace manifest.
toml_edit.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
# An API answer's validator is a digest of its bytes (`commands/serve/validated.rs`).
sha2.workspace = true
hex.workspace = true

# `suzatary typeset` caps its own address space, through a safe `setrlimit`.
rustix = { version = "1", features = ["process"] }
async-stream = "0.3"

# THE FIXTURE IS NOT IN THE SHIPPED BINARY; `suzatary-dev` is the one binary built with it.
# `--whois-fixture` makes every peer one login, which puts the write surface in a browser test's
# reach. A feature, not a flag: a flag in the shipped program would be a write path anything
# that sets an environment variable could reach, and removal is checkable.
[features]
default = []
fixture = ["suzatary-core/fixture"]

# THE TWO TEST TARGETS THAT ARE NOT ABOUT THIS CRATE. `tests/guards.rs` live-fires the
# repository's containment scripts with `git` against throwaway repositories, which a build
# sandbox (`appSrc` is `app/`) cannot hold. `test = false` keeps it out of `cargo test` and
# `nix flake check`; the merge gate and CI run it by name.
[[test]]
name = "guards"
path = "tests/guards.rs"
test = false

# AND THE LIVE CHAIN'S PINS, BY THE SAME RULE: `tests/live.rs` is SPEC §9 against the
# deployment's own `events/`, which the sandbox does not hold; the gate's live half names it.
[[test]]
name = "live"
path = "tests/live.rs"
test = false

# `suzatary plugin sync` over a loopback feed, against the reference plugins the flake builds
# (`SUZATARY_PLUGINS`), run by name like the plugin host's fences.
[[test]]
name = "plugin"
path = "tests/plugin.rs"
test = false

[dev-dependencies]
# A scratch cache tier for `tests/plugin.rs`.
tempfile = "3"
# Programs a test makes and runs, never executing a file its process wrote.
suzatary-testkit = { path = "../testkit" }
# Inert effects the fakes fill a record with.
suzatary-core = { workspace = true, features = ["nothing"] }
# The integration tests drive the axum app with FAKE capabilities, which needs
# a client and a runtime of their own; a socket bound to a second loopback
# address is a second tailnet peer (tests/google.rs).
tokio = { workspace = true, features = ["net", "io-util"] }
ureq.workspace = true
# The benchmark harness (tests/perf_fold_chain.rs) hashes bodies (with the
# library's sha2) and gzips them at each level itself, to break a route's time
# into its parts.
flate2 = "1"
# A PDF upload is base64 in its JSON body (tests/secretary.rs).
base64.workspace = true
# The onboarding's law, over generated answers (commands/init.rs), and the instance edits'
# byte laws (instance/connections.rs).
proptest.workspace = true

[lints]
workspace = true

# ONE TEST BINARY (`autotests = false` above): every file under `tests/` is a
# module of `tests/all.rs`, so the suite links the application once, not per file.
[[test]]
name = "all"
path = "tests/all.rs"
