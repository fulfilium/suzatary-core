[package]
name = "suzatary-api"
description = "Suzatary's wire and the routes the browser and the box share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
name = "suzatary_api"
path = "src/lib.rs"

[dependencies]
prodrome_data.workspace = true
prodrome_dag.workspace = true
prodrome_store.workspace = true
prodrome_term.workspace = true
prodrome_fpl.workspace = true
prodrome_todo.workspace = true
suzatary-base.workspace = true
suzatary-record.workspace = true
suzatary-release.workspace = true
suzatary-store.workspace = true
suzatary-signatures.workspace = true
suzatary-todo.workspace = true
suzatary-held.workspace = true
suzatary-mail.workspace = true
suzatary-triage.workspace = true
suzatary-connect.workspace = true
suzatary-conversations.workspace = true
suzatary-lines.workspace = true
suzatary-topics.workspace = true
suzatary-cards.workspace = true
suzatary-inbox.workspace = true
suzatary-stores.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
regex.workspace = true
base64.workspace = true
chrono.workspace = true

[dev-dependencies]
prodrome_memo.workspace = true
prodrome_tags.workspace = true
prodrome_reading.workspace = true
suzatary-memory.workspace = true
suzatary-health.workspace = true
suzatary-services.workspace = true
suzatary-google.workspace = true
suzatary-stores = { workspace = true, features = ["nothing"] }
suzatary-cards = { workspace = true, features = ["nothing"] }
# Not `suzatary-testkit`: the wire and the vectors build these from the core library alone.
tempfile = "3"
proptest.workspace = true
# A device key is printed as hex (`tests/lines_rule.rs`).
hex.workspace = true

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
