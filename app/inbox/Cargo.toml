[package]
name = "suzatary-inbox"
description = "Suzatary's inbox: proposals, acts, taps and phases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
name = "suzatary_inbox"
path = "src/lib.rs"

[dependencies]
prodrome_data.workspace = true
prodrome_dag.workspace = true
prodrome_term.workspace = true
prodrome_fpl.workspace = true
prodrome_todo.workspace = true
prodrome_reading.workspace = true
suzatary-base.workspace = true
suzatary-record.workspace = true
suzatary-store.workspace = true
suzatary-signatures.workspace = true
suzatary-todo.workspace = true
suzatary-held.workspace = true
suzatary-memory.workspace = true
suzatary-mail.workspace = true
suzatary-health.workspace = true
suzatary-triage.workspace = true
suzatary-services.workspace = true
suzatary-google.workspace = true
suzatary-connect.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
ts-rs.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true

# The drawn proposal and responses (`drawn`), under `nothing` alone.
proptest = { workspace = true, optional = true }

# `secretary::inbox_json`: the exports' `Json` is implemented beside the type.
prodrome-wasm-exports = { workspace = true, optional = true }

[features]
nothing = ["dep:proptest", "suzatary-base/nothing", "suzatary-record/nothing", "suzatary-store/nothing", "suzatary-signatures/nothing", "suzatary-todo/nothing", "suzatary-held/nothing", "suzatary-memory/nothing", "suzatary-mail/nothing", "suzatary-health/nothing", "suzatary-triage/nothing", "suzatary-services/nothing", "suzatary-google/nothing", "suzatary-connect/nothing"]
# The browser module's view of the inbox's schema; `app/wasm` alone enables it.
wasm = ["dep:prodrome-wasm-exports"]

[dev-dependencies]
suzatary-inbox = { path = ".", features = ["nothing"] }
proptest.workspace = true

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
