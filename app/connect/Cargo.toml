[package]
name = "suzatary-connect"
description = "Suzatary's declared connections and settings, their secrets and checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
name = "suzatary_connect"
path = "src/lib.rs"

[dependencies]
prodrome_core.workspace = true
suzatary-base.workspace = true
suzatary-record.workspace = true
suzatary-held.workspace = true
suzatary-mail.workspace = true
suzatary-health.workspace = true
suzatary-services.workspace = true
suzatary-google.workspace = true
thiserror.workspace = true
serde.workspace = true
ts-rs.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true

[features]
nothing = ["suzatary-base/nothing", "suzatary-record/nothing", "suzatary-held/nothing", "suzatary-mail/nothing", "suzatary-health/nothing", "suzatary-services/nothing", "suzatary-google/nothing"]

[dev-dependencies]
suzatary-connect = { path = ".", features = ["nothing"] }
proptest.workspace = true
serde_json.workspace = true
# A plugin's manifest is read as the instance file spells it.
toml.workspace = true

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
