[package]
name = "suzatary-store"
description = "Suzatary's object store and its replica, for any schema (see ../../docs/CORESPLIT-PLAN-2026-11-06.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "suzatary_store"
path = "src/lib.rs"

[dependencies]
prodrome_data.workspace = true
prodrome_dag.workspace = true
prodrome_declared.workspace = true
prodrome_memo.workspace = true
prodrome_store.workspace = true
suzatary-base.workspace = true
thiserror.workspace = true
serde.workspace = true
ts-rs.workspace = true
postcard.workspace = true
hex.workspace = true
sha2.workspace = true
# The laws an order and a join state (`laws`), under `nothing` alone.
proptest = { workspace = true, optional = true }

[features]
nothing = ["suzatary-base/nothing", "dep:proptest"]

[dev-dependencies]
suzatary-store = { path = ".", features = ["nothing"] }
proptest.workspace = true

[lints]
workspace = true

# A target of its own, so `suites.rs` in the cli's tests sees it run.
[[test]]
name = "signature"
path = "tests/signature.rs"

[[test]]
name = "writes"
path = "tests/writes.rs"

[[test]]
name = "held"
path = "tests/held.rs"
