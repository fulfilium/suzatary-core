# What this machine needs to hold, declared but never valued.
#
# Committed on purpose: this file says WHICH secrets Suzatary requires, not what
# they are. `secretspec check` on a fresh box turns "set it up again" from a
# runbook nobody wrote into a list the tool prints, and turns a missing
# credential into an error at setup time instead of a silently failing timer at
# 03:00 (see the 2026-07-26 auth lapse, when six triage runs were dropped and
# systemd reported success every time).
#
# SCOPE — deliberately only the STATIC secrets. Suzatary's other credentials are
# mutable state and do not belong here:
#   ~/.local/state/suzatary/oauth/<slug>.json   this program rewrites the
#                                               Microsoft refresh grant on every
#                                               token refresh (it was
#                                               ~/.ms-oauth-*.json and msal's,
#                                               until 2026-09-08)
#   Mail/*/.credentials.*.json                  lieer rewrites these likewise
#   bridge-v3/vault.enc                         Proton Bridge owns and rotates it
# secretspec hands out read-only values, so putting a self-refreshing token
# behind it would break the refresh. Their recovery path is re-running the
# device-code / OAuth flow — `suzatary auth <email> [--scope imap|smtp]` — which
# is the correct answer for a rotating credential anyway. They ride in the
# daily vault, seven kept (scripts/vault-backup.sh), so a restore does not
# need a browser.
#
# PROVIDER: `pass`, set per-machine in ~/.config/secretspec/config.toml. Not
# `keyring` — it needs a DBus secret-service and fails on this headless box with
# "Unable to autolaunch a dbus-daemon without a $DISPLAY". `pass` was already
# here, backing Proton Bridge's keyring with a passphraseless GPG key.
[project]
name = "suzatary"
revision = "1.0"

# require_reason defaults to "agents", and that default is kept on purpose. Every
# secret read from an agent context must state why, and lands in
# ~/.local/state/secretspec/audit.log. This repo's whole containment story is
# that the unattended triage agent reads attacker-controlled mail all day, so a
# log of who asked for a credential and why is worth the small friction. Both
# call sites pass --reason.

[profiles.default]

SUZATARY_DATA_PUSH_TOKEN = { description = "Fine-grained GitHub token for the DATA repository alone (Contents read and write; Metadata read is implied). Used by scripts/git-credential-secretspec.sh so safe-push.sh can push the stores, and by nothing else: the secretary's repositories have a token of their own, so a leak of this one reaches neither the code repositories nor their pull requests. Settable from the Settings page or the Inbox card the box files when it does not resolve, or `secretspec set SUZATARY_DATA_PUSH_TOKEN` in a plain terminal. Rotate before it expires.", required = true }

SUZATARY_REPOS_TOKEN = { description = "Fine-grained GitHub token for the repositories `[[secretary.repos]]` and `[coding] repo` name, and those alone (Contents read and write, Pull requests read and write; Metadata read is implied). The secretary reads them with it, and a tapped patch pushes its branch and opens its pull request with it; never the data repository's token. Settable from the Settings page or its Inbox card, or `secretspec set SUZATARY_REPOS_TOKEN` in a plain terminal. Optional: without it the repositories answer that the token does not resolve.", required = false }

CACHIX_AUTH_TOKEN = { description = "Push token of the public `bmabsout` Cachix cache, scoped to that cache alone. Read once by scripts/core-settings.sh, which hands it on stdin to `gh secret set` as core's Actions secret of the same name, where .github/workflows/gate.yml's jobs push what they build; nothing on the box pushes with it. Mint it in Cachix under the cache's settings, Auth tokens; store with `secretspec set CACHIX_AUTH_TOKEN` in a plain terminal, then run scripts/core-settings.sh again. Optional: without it the gate's jobs read the cache and push nothing to it.", required = false }

PROTON_BRIDGE_PASSWORD = { description = "Bridge-generated password for the Proton account on the local Proton Bridge — IMAP on 127.0.0.1:1143 (mbsync) and SMTP on 127.0.0.1:1025 (`suzatary send`, over STARTTLS with the same pinned self-signed certificate). NOT the Proton account password. Regenerated from `protonmail-bridge --cli` if Bridge is ever re-logged-in.", required = true }

ANDROID_KEYSTORE_B64 = { description = "base64 of the PKCS12 keystore that signs the Android APK, and the ONE secret here that cannot be regenerated: Android identifies an app by (package, signing certificate), so a new key is a new app and every phone has to uninstall and reinstall, losing the offline fold in localStorage. Mint once with the keytool line at the top of scripts/sign-apk.sh, then `base64 -w0 <keystore> | secretspec set ANDROID_KEYSTORE_B64`. Also a GitHub Actions secret of the same name, which is where it is actually used (.github/workflows/release-apk.yml); declared here so a fresh box restores it from the vault instead of discovering it is gone. Optional: the box does not sign, CI does.", required = false }

SUZATARY_GMAIL_PASSWORD = { description = "Password of the system's OWN Google account (the owner, 2026-09-06), empty of anything personal, for registering third-party services the system needs (Firebase/FCM for push, etc.). Not a mail account the triage agent reads. Given to the assistant in chat on purpose; stored here so a fresh box has it. Prefer 2-step verification plus app passwords on that account when a service allows it.", required = false }

FCM_SERVICE_ACCOUNT_B64 = { description = "base64 of the JSON key of the suzatary-push service account (roles/firebasemessaging.admin) in the Suzatary Firebase project. The box mints a short-lived token from it and calls FCM v1 to wake the phone with an OPAQUE message (title, count, click URL). Never printed; rotate by creating a new key in the Google Cloud console and deleting the old one.", required = false }

NTFY_TOPIC = { description = "The ntfy.sh topic the phone's ntfy app subscribes to — 32 random characters, and the ONLY thing standing between the internet and a notification on the owner's phone (anyone who has it can post junk, nobody can read anything: every message is a `suzatary_core::capability::Push`, a closed sum of counts, a day and ids the box minted, printed by the core, so no stored text has a field to ride in). Mint: `head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 32`, store with `secretspec set NTFY_TOPIC <value>` in a plain terminal, then subscribe the phone. Optional: without it nothing is sent and the log says so once.", required = false }

ANDROID_KEYSTORE_PASSWORD = { description = "Password for ANDROID_KEYSTORE_B64. PKCS12, so this is both the store and the key password; scripts/sign-apk.sh passes it to apksigner as SUZATARY_KEYSTORE_PASSWORD through the environment, never argv. Also a GitHub Actions secret of the same name.", required = false }

CLAUDE_CODE_OAUTH_TOKEN = { description = "Long-lived headless auth token from `claude setup-token` (~1 year). Frees hourly triage from the interactive session's 8h OAuth cycle — the cause of the 2026-07-26, 2026-08-26 and 2026-08-29 outages. Static by construction, unlike the self-refreshing ~/.claude/.credentials.json which stays OUT of secretspec per the scope note above. Mint: `claude setup-token` in a plain terminal; store: `secretspec set CLAUDE_CODE_OAUTH_TOKEN` from the repo root. Optional until minted; the wrapper falls back to the credentials-file check when absent.", required = false }

SUZATARY_ROUTINE_TOKEN = { description = "Bearer token of the ONE Claude Code routine a tapped coding session fires (docs/CODINGSESSION-PLAN-2026-09-27.md §1): `POST https://api.anthropic.com/v1/claude_code/routines/{id}/fire`, the id named by `[coding] routine` in instance.toml. It starts a cloud session on the owner's account usage and nothing else; the routine's saved prompt (docs/CODINGSESSION-ROUTINE.md) is the containment. Shown once when generated at claude.ai/code/routines; store it from the app's Settings page (settable only while `[coding]` names a routine) or `secretspec set SUZATARY_ROUTINE_TOKEN` in a plain terminal, never pasted into a chat. Optional: without it a tap on a coding session is refused in words.", required = false }

SUZATARY_BOX_KEY = { description = "The box's own Ed25519 signing key, its 32-byte seed as 64 lowercase hex: the ROOT whose public half `instance.toml`'s `[signatures] root` names. It signs every object the box writes to a chain and every key object (a device registered by a tap or `suzatary device trust`, revoked by `suzatary device revoke`), so a device key counts only where it signed. Minted by `suzatary device init` from the OS's randomness and set here on stdin; nobody types or pastes it. Losing it means a new root: every device enrolled again. A leak lets the holder register keys and sign as anyone, so rotate (a new init, a new root line) and re-enrol. Optional until the instance declares `[signatures]`.", required = false }

SUZATARY_AGENT_KEY = { description = "The triage agent's Ed25519 signing key, its seed as 64 lowercase hex, registered for the agent's actor alone, so no other key of the box's proves a write as the agent; since the agent's writes became Inbox cards (2026-10-24) it signs nothing. Minted by `suzatary device init` beside SUZATARY_BOX_KEY. Optional until the instance declares `[signatures]`.", required = false }

SUZATARY_DEDUP_KEY = { description = "The key the triage names a message by in the pushed `state.json`: 32 bytes as 64 lowercase hex, an HMAC-SHA256 key over each message's canonical content hash, so the file the data repository pushes says how many messages were decided and how, and of no message whether this box received it. Minted by `suzatary device init` from the OS's randomness beside SUZATARY_BOX_KEY and set here on stdin; nobody types or pastes it. Losing it is losing the dedup: every message in the window is triaged again under a new key, so it rides in the vault with the pass store. Required once mail is triaged.", required = false }
