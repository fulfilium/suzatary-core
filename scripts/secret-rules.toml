# The leak guard's additions to gitleaks's default rules. Never turn a rule off for a file: a
# vouched-for fixture key goes in `.gitleaksignore` by fingerprint and in
# `scripts/public-admitted.sha256` by digest.

[extend]
useDefault = true

# `claude setup-token`'s token; the default rules know only the API's keys.
[[rules]]
id = "anthropic-oauth-token"
description = "A Claude subscription's OAuth token"
regex = '''\b(sk-ant-oat01-[A-Za-z0-9_\-]{80,})'''
keywords = ["sk-ant-oat01-"]

# A web vector's render key is two content addresses, regenerated too often to admit by digest.
# Keyed on the line's shape alone: the scanner reads every file under a neutral name.
[[allowlists]]
description = "a web vector's render key: two SHA-256 digests"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"key": "[0-9a-f]{64} [0-9a-f]{64}"$''']

# A go.sum line's `h1:` checksum is random bytes the generic rule takes for a key.
[[allowlists]]
description = "a go.sum line: a module, its version and its h1: checksum"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*[a-z0-9.!_~/-]+ v[0-9][0-9A-Za-z.+-]*(/go\.mod)? h1:[A-Za-z0-9+/]{43}=$''']
