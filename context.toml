# The context budget: how many tokens an agent must read to USE each unit of this repository (its
# README and its public interface) and to DEVELOP it (its own production source, its scripts, the
# documents they and CLAUDE.md/AGENTS.md cite, and the USE of every unit it depends on).
#
# The goal is that no unit is over `budget.use` or `budget.develop`. `suzatary context` reads this
# file; `scripts/context.sh` prints its table and names each unit still over and by how much. The
# guard app/cli/tests/guards/context.rs fails when a unit's USE is over `budget.use` (or over its
# `ratchet.use` plus `budget.allowance`), when the repository's reading set grows past
# `ratchet.reading` plus `budget.allowance`, or when a unit's `depends` differs from what its
# Cargo.toml or its `witnesses` say.

[budget]
# Tokens a dependent reads to use one unit.
use = 25000
# Tokens an agent reads to change one unit.
develop = 500000
# Tokens of one unit's tests (fixtures are reported beside them).
tests = 500000
# Tokens a pull request may grow the reading set by before the guard refuses it.
allowance = 2000

[ratchet]
# The repository's reading set in tokens. Only `scripts/context.sh record` writes it, and only
# downward.
reading = 2930730

# The USE of each unit over `budget.use` today. Only `scripts/context.sh record` writes it, and
# only downward; a unit back within budget leaves the table.
[ratchet.use]
cli = 81630
core = 466226
io = 52061

# Characters per token for each kind of file, measured with Claude's tokenizer by
# `scripts/context.sh calibrate` over the files of `tokens.sample`.
[tokens]
calibrated = "2026-11-04T07:18:17Z"

[tokens.ratio]
rust = 2.559
typescript = 2.831
markdown = 2.721
shell = 2.432
nix = 2.604
toml = 2.482
typst = 2.887
other = 2.208

