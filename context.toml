# The libraries this repository uses from outside it, each at the one revision `pinned_in` holds,
# so moving the pin without measuring again fails the guard. Each part is measured from its own
# directory at that revision by `scripts/context.sh external <name> <checkout>`; a dependent of a
# part is charged the USE of every part it `reexports` beside its own.

[[library]]
source = "https://github.com/fulfilium/prodrome"
rev = "a5ecf0ccc39591ffe4a54e3b006b9e0931f64aa0"
pinned_in = "app/Cargo.toml"

[[library.external]]
name = "prodrome-data"
path = "data"
shape = "crate"
use = 22507

[[library.external]]
name = "prodrome-memo"
path = "memo"
shape = "crate"
use = 8422

[[library.external]]
name = "prodrome-dag"
path = "dag"
shape = "crate"
# Its `fold`, `policy` and `sign` re-export the data crate's modules of those names.
reexports = ["prodrome-data"]
use = 14005

[[library.external]]
name = "prodrome-declared"
path = "declared"
shape = "crate"
use = 3962

[[library.external]]
name = "prodrome-core"
path = "core"
shape = "crate"
# Every item of the four crates above is also at its old path in the core.
reexports = ["prodrome-data", "prodrome-memo", "prodrome-dag", "prodrome-declared"]
use = 64676

[[library.external]]
name = "prodrome-wasm-exports"
path = "wasm/exports"
shape = "crate"
use = 7042

[[library.external]]
name = "prodrome-typst-wasm"
path = "typst-wasm"
shape = "crate"
use = 3954

[[library]]
