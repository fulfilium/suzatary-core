# What the repository's reading set holds beside every unit's production source, scripts and
# README: the paths of production code that belong to no unit, and the manuals.
[repository]
include = ["CLAUDE.md", "AGENTS.md", "README.md", "OPERATOR.md", "SECRETARY.md", "flake.nix", "android", "nix", "scripts", "templates", "tokens.typ", "app/Cargo.toml", "app/wit"]
# Logs that the manuals cite as a place to append to or search, which no agent reads whole.
records = ["CHANGELOG.md"]
# The directory of the documents: a bare document name resolves under it, and its dated plans that
# nothing in the reading set cites are listed.
documents = "docs"

# One unit per workspace member, and the web app. `depends` names the units and the external
# libraries this unit's code uses: for a crate, its Cargo.toml's `[dependencies]` (crates.io
# libraries are not measured); for any unit, also a unit whose `witnesses` text appears in its
# production source. `scripts` are the scripts an agent reads to build and test it.

[[unit]]
name = "base"
path = "app/base"
shape = "crate"
depends = ["prodrome-core"]
scripts = []

[[unit]]
name = "core"
path = "app/core"
shape = "crate"
depends = ["base", "prodrome-core", "prodrome-wasm-exports"]
scripts = ["scripts/wire.sh"]

[[unit]]
name = "io"
path = "app/io"
shape = "crate"
depends = ["base", "core", "prodrome-core", "prodrome-typst-wasm"]
scripts = []

[[unit]]
name = "plugin"
path = "app/plugin"
shape = "crate"
depends = ["base", "core", "io", "prodrome-core"]
scripts = ["scripts/plugin-sync.sh"]

[[unit]]
name = "cli"
path = "app/cli"
shape = "crate"
depends = ["base", "core", "io", "plugin", "prodrome-core"]
scripts = ["scripts/app-bin.sh", "scripts/app-build.sh", "scripts/merge-gate.sh"]

[[unit]]
name = "wasm"
path = "app/wasm"
shape = "crate"
depends = ["base", "core", "prodrome-core", "prodrome-wasm-exports"]
scripts = ["scripts/web-inputs.sh"]

[[unit]]
name = "viewtree"
path = "app/viewtree"
shape = "crate"
depends = []
scripts = []

[[unit]]
name = "pages"
path = "app/pages"
shape = "crate"
depends = ["base", "core", "prodrome-core", "viewtree"]
scripts = ["scripts/wire.sh", "scripts/web-inputs.sh"]

[[unit]]
name = "plugin-ics"
path = "app/plugin-ics"
shape = "crate"
depends = ["prodrome-core"]
scripts = ["scripts/plugin-sync.sh"]

[[unit]]
name = "plugin-fence"
path = "app/plugin-fence"
shape = "crate"
depends = []
scripts = []

[[unit]]
name = "testkit"
path = "app/testkit"
shape = "crate"
depends = []
scripts = []

[[unit]]
name = "web"
path = "web"
shape = "web"
# The modules the page and the service worker load; their exports are the web unit's interface.
entries = ["web/src/boot.ts", "web/src/main.ts", "web/src/sw.ts", "web/src/typst/worker.ts", "web/src/prodrome/worker.ts"]
depends = ["core", "pages", "prodrome-typst-wasm", "typst-design", "viewtree", "wasm"]
scripts = ["scripts/build-web.sh", "scripts/web-dist.sh", "scripts/web-inputs.sh", "scripts/web-static.sh", "scripts/web-test.sh", "scripts/web-e2e.sh", "scripts/wire.sh", "scripts/gen-tokens.mjs", "scripts/typst-packages.mjs"]

[unit.witnesses]
"wire/generated/wire" = "core"
"wire/generated/payload" = "core"
"wire/generated/pages" = "pages"
"views_bg.wasm" = "pages"
"prodrome_bg.wasm" = "wasm"
"typst_bg.wasm" = "prodrome-typst-wasm"
"app/viewtree/" = "viewtree"
"typst-design" = "typst-design"

# The libraries this repository uses from outside it, each measured from its pinned source by
