# The flags every cargo step in CI builds with: the cargo-target action installs
# this as $CARGO_HOME/config.toml and names its target by it; the box's builds
# read app/Cargo.toml alone.

[build]
incremental = false

# No debug info: nobody attaches a debugger to a gate.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# No linker here: `nix develop .#rust` links with mold (flake.nix, `rustToolchain`),
# and cargo passes a `[target]` rustflags here before the environment's, not instead.
