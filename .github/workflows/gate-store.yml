name: Gate store

# THE STORE THE GATE'S JOBS START FROM (.github/workflows/gate.yml). A run on a branch reads only
# the Actions caches saved on that branch or on master, and every train gates on a new branch, so
# this job saves one on master on each publication: the builds no binary cache serves (the crane
# dependency builds and the Prodrome's typst module), keyed by what they are built from. The
# operator's shell is left out: cache.nixos.org serves all of it but three small paths.
#
# THE BUDGET. A repository's Actions cache holds 10 GB and GitHub evicts the least recently used
# entries past it, so the store is collected down to the roots below before saving, every older
# entry is purged after, and the size step fails past half of the 10 GB; a failed step here is no
# gate's verdict.
#
# THE CARGO LANES' DEPENDENCY BUILD. The same job runs the gate's cargo steps and keeps
# `app/target` through the cargo-target action (`for: gate`), which gate.yml's checks, tests and
# guards lanes restore.
#
# WHO REACHES WHAT. Only a push to master runs this, in the public repository alone; it names no
# secret and pushes nothing to the Cachix. Its token may delete this repository's Actions caches
# (`actions: write`), which the purge needs; no job of gate.yml holds that.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: gate-store

jobs:
  store:
    if: ${{ !github.event.repository.private }}
    # The gate's runners: the store is theirs.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write
    steps:
      - name: Free the runner's disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache || true
          df -h /

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # gate.yml's settings, so the store saved is the store its jobs run in.
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            extra-substituters = https://bmabsout.cachix.org
            extra-trusted-public-keys = bmabsout.cachix.org-1:/GhCEayGQ3NHMIlJiUelQrLtHHXVdGjHtyDz32xNAo4=

      # The last store, so a moved key builds only what moved.
      - name: The last store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        continue-on-error: true
        with:
          primary-key: gate-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'app/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-prefixes-first-match: gate-store-${{ runner.os }}-${{ runner.arch }}-

      # Each rooted, so the collection below keeps them and nothing else.
      - name: Build what the gate's jobs start from
        run: |
          set -euo pipefail
          roots="$RUNNER_TEMP/roots"
          mkdir -p "$roots"
          for out in suzatary-deps suzatary-wasm-deps suzatary-views-wasm-deps suzatary-wasm-dev-deps suzatary-views-wasm-dev-deps suzatary-model-deps suzatary-typst-wasm; do
            nix build --print-build-logs --out-link "$roots/$out" ".#$out"
          done

      - name: Collect the store down to the roots
        run: |
          set -euo pipefail
          nix store gc
          bytes="$(nix path-info --all --size | awk '{ sum += $2 } END { print sum + 0 }')"
          echo "the store holds $((bytes / 1000000)) MB uncompressed"

      - name: Save the store, and purge the older ones
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: gate-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'app/Cargo.lock', 'app/**/Cargo.toml') }}
          purge: true
          purge-prefixes: gate-store-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      # Two entries while a new one is saved: so one is at most half of the 10 GB.
      - name: The entry's size
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: gate-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'app/Cargo.lock', 'app/**/Cargo.toml') }}
          LIMIT: 5000000000
        run: |
          set -euo pipefail
          bytes="$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=$GITHUB_REF&key=$KEY" \
            --jq '[.actions_caches[] | select(.key == env.KEY) | .size_in_bytes] | add // 0')"
          echo "the store's entry is $((bytes / 1000000)) MB"
          if ((bytes > LIMIT)); then
            echo "::error::the gate's store is $((bytes / 1000000)) MB, over the $((LIMIT / 1000000)) MB that keeps two of it inside the repository's 10 GB Actions cache"
            exit 1
          fi

      # The cargo lanes' dependency build so far (above): when it holds this key, nothing is built.
      - id: target
        name: The cargo lanes' dependency build
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/cargo-target
        with: { for: gate, mode: restore }

      # A red step still leaves its dependencies built, but a gate that did not start (75) built
      # nothing, so nothing is saved.
      - id: built
        name: Build what the cargo lanes compile
        if: ${{ !cancelled() && steps.target.outputs.hit != 'true' }}
        run: |
          set -uo pipefail
          code=0
          nix develop .#triage -c scripts/merge-gate.sh --no-live --steps clippy,clippy-fixture,doc,build || code=$?
          ((code != 75)) || { echo "::error::the gate did not start, so no dependency build is saved"; exit 1; }

      - name: Save the cargo lanes' dependency build
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        uses: ./.github/actions/cargo-target
        with: { for: gate, mode: save }

      # Past 1.5 GB the step fails, which keeps the entry beside the store inside the 10 GB.
      - name: Purge the older dependency builds, and the entry's size
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.target.outputs.key }}
          LIMIT: 1500000000
        run: |
          set -euo pipefail
          [[ -n "$KEY" ]] || { echo "::error::the dependency build's key is unknown, so nothing is purged"; exit 1; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=gate-target-" \
            --jq '.actions_caches[] | select(.key != env.KEY) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"; done
          bytes="$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=$GITHUB_REF&key=$KEY" \
            --jq '[.actions_caches[] | select(.key == env.KEY) | .size_in_bytes] | add // 0')"
          echo "the dependency build's entry is $((bytes / 1000000)) MB"
          if ((bytes > LIMIT)); then
            echo "::error::the cargo lanes' dependency build is $((bytes / 1000000)) MB, over the $((LIMIT / 1000000)) MB that keeps it beside the store inside the repository's 10 GB Actions cache"
            exit 1
          fi
