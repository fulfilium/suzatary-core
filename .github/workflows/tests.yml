name: Triage tests

# ON RELEASES, NOT ON EVERY PUSH (the owner, 2026-09-13: "maybe for the github
# actions we shouldn't be doing it every commit, but every release?"). The
# suite this runs — the workspace's tests, the web tests, the browser suite — is
# the same one that gates every train locally (scripts/merge-gate.sh, and the
# session's own gates), so a run per push was a second opinion at about an
# hour of runner each; September's included minutes were gone by the 12th and
# every run after that concluded with zero steps. A release is a `v<version>`
# tag (CLAUDE.md, Versioning), and since every train tags one, only a train
# that moved MINOR or MAJOR (`v*.*.0`) is worth the second opinion's hour. A
# manual dispatch still runs it, because that is a person asking.
# Pushes to master get quick.yml (fmt, clippy, docs) and every train the
# merge gate, guards and live pins included, so what this workflow adds is
# the proof that the NIX DERIVATIONS build: the release binary, the fixture
# (`suzatary-dev`), the two checks and the generators, each from crane's
# shared dependency build.
on:
  push:
    tags: [ 'v*.*.0' ]
  workflow_dispatch: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit-message check replays the whole pushed range

      # THE RUNNER'S OWN DISK IS THE CONSTRAINT (2026-09-09, same disease as
      # CLAUDE.md's Log 2026-09-08 (5), one box over): `/nix` and `app/target`
      # both land on the ~14GB free on ubuntu-latest's root filesystem.
      # `nix flake check` below used to build the whole crate twice on its own
      # (`suzatary-core`, `suzatary-clippy`; since 2026-09-13 both start from
      # crane's one dependency build). None of what's removed here is this repo's:
      # Android SDK, .NET, GHC and Swift are GitHub's own preinstalled
      # toolchains, unused by anything in this workflow, at ~30GB combined.
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /opt/hostedtoolcache || true
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # WHAT THE CACHE CARRIES NOW IS THE DEPENDENCY BUILD (crane, 2026-09-13):
      # `suzatary-deps`, keyed on Cargo.lock, is what every derivation below
      # starts from, and it is the thing that used to be rebuilt six times a
      # run. The key includes app/Cargo.lock so a dependency bump saves a new
      # entry rather than restoring a stale one, and the prefix restore keeps
      # the nearest older store when only the lock moved. The store is garbage
      # collected to a ceiling before saving so the entry stays under GitHub's
      # 10 GB per-repository cache — shared with quick.yml's two caches, which
      # is why this one is the smaller of the ceilings: a release is rare and
      # may wait, a push is not.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'app/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # The same gates the merge gate runs on the box.
      - name: Every commit message is a claim about its diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~5..HEAD"
          fi
          echo "checking $range"
          scripts/check-commits.sh "$range"

      # THE SUITE IS THE RUST ONE (§8.6). `nix flake check` runs the flake's
      # two checks — `suzatary-core` is cargo test over the application's own
      # laws, `suzatary-clippy` is clippy over the workspace with warnings
      # denied — from the vendored lock, so no rustup and no crates.io. It was
      # four until 2026-09-09, when the database became its own repository
      # (§8.8): SPEC §9 against the seeded vectors is
      # https://github.com/fulfilium/prodrome's CI, which ran on the commit this
      # repository's flake input pins. It EVALUATES the packages and shells
      # beside them rather than building them, so the APK is not dragged into
      # every run; the same command is what the box runs.
      - name: Check the Rust (cargo test, clippy)
        run: nix flake check --print-build-logs

      # The application's binary, built as its own step so a failure here is
      # attributable to it (docs/ARCHITECTURE.md §2). `doctor` is the smoke:
      # it names which capabilities have an interpreter, so a binary that
      # builds and can do nothing says so out loud.
      - name: Build the application (nix build .#suzatary)
        run: |
          nix build .#suzatary --print-build-logs
          ./result/bin/suzatary --version
          ./result/bin/suzatary doctor

      # The web app's two gates. build-web.sh copies in the wire's TypeScript
      # and folds its decoders from it (scripts/wire.sh: generated from
      # app/core/src/wire.rs, so the browser's declarations and the server's
      # are ONE declaration), runs tsc over web/src AND web/test,
      # refuses any source that parses markup out of a string, and writes the
      # bundle; web-test.sh runs the pure modules under node's test runner (the
      # chain verifier, the knots-to-drawing transform, the wire guards).
      # Neither needs a backend or a browser.
      #
      # CI STAYS PURE: since the `.#triage` shell stopped carrying
      # `.#suzatary-wire-ts` (2026-09-08 — every edit under app/ used to force
      # a ~30-minute release rebuild of it before a single test could run),
      # scripts/wire.sh falls back to a `cargo test` in the shell when
      # `$SUZATARY_WIRE_TS` is unset. CI sets it from the derivation instead,
      # so these steps stay Nix builds and never invoke cargo themselves.
      - name: Build the web app (tsc + esbuild)
        run: |
          export SUZATARY_WIRE_TS="$(nix build .#suzatary-wire-ts --no-link --print-out-paths)"
          nix develop .#triage --command scripts/build-web.sh

      - name: Run the web app's node tests
        run: |
          export SUZATARY_WIRE_TS="$(nix build .#suzatary-wire-ts --no-link --print-out-paths)"
          export SUZATARY_PRODROME_CONFORMANCE="$(nix build .#suzatary-vector-json --no-link --print-out-paths)"
          nix develop .#triage --command scripts/web-test.sh

      # THE UI'S TEST SUITE USED TO BE AN EYE. The two steps above are the type
      # gate and the pure modules; neither renders a page, so until now every
      # claim about what the app DOES rested on a screenshot somebody looked at.
      # This runs the built frontend in the headless chromium the .#triage shell
      # carries (web/e2e/cdp.ts drives it over CDP — node's global WebSocket
      # is the whole client, so CI installs nothing), against two fixture
      # servers over temp chains. ~40s, and a failure leaves a screenshot whose
      # path is in the message.
      #
      # Same purity rule as the step above: `$SUZATARY_FIXTURE` set from the
      # derivation, so web-e2e.sh never falls back to building it with cargo.
      #
      # ⚠️ AND THE WAITS ARE STRETCHED HERE (2026-09-10). Every wait in that
      # suite is REAL time against a page holding an SSE connection, so the
      # numbers the scenes carry are judgements made on a developer's box —
      # and this runner is a shared two-core machine starting everything cold.
      # `SUZATARY_E2E_WAIT_MS` scales all of them by one factor rather than
      # editing fifty of them (`web/e2e/cdp.ts`), so a slow morning is a slow
      # run instead of a red one. Two runs died on exactly this before it
      # existed.
      - name: Drive the web app in a browser
        env:
          SUZATARY_E2E_WAIT_MS: 60000
        run: |
          export SUZATARY_FIXTURE="$(nix build .#suzatary-fixture --no-link --print-out-paths)"
          nix develop .#triage --command scripts/web-e2e.sh

