name: Update flake.lock

# A new nixpkgs brings a new clippy and rustc, whose lints can fail the merge
# gate, so the bump is a pull request that rides a train, never a push to master.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 0'  # weekly, Sunday midnight UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1

      - name: Update flake.lock
        run: nix flake update

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --staged --quiet; then
            echo "flake.lock already up to date"
            exit 0
          fi
          git switch -c flake-update
          git commit -m "deps: the flake's inputs, weekly"
          git push --force origin flake-update
          gh pr view flake-update >/dev/null 2>&1 || gh pr create --head flake-update \
            --title "deps: the flake's inputs, weekly" \
            --body "nix flake update. A new toolchain's lints are fixed on this branch before it rides a train."
