name: Gate

# THE MERGE GATE'S TREE HALF, ON GITHUB'S RUNNERS (scripts/train.sh gate --remote github). This
# file runs in suzatary-core, the public repository the train publishes to, where runners cost
# nothing. The train pushes one commit to a branch `gate/<train sha>`: the train commit's public
# tree, a function of its tree. Each job checks out that one commit (depth 1, so it reads the tree
# and no history) and runs one lane of scripts/merge-gate.sh's tree half with `--steps`; the steps
# that read the private repository run on the box (train.sh's `box_before` and `box_after`), and a
# guard test holds the lists to every step of the half. The train dispatches master's
# publication.yml for the same commit, which builds what a deploy builds beside these jobs, and the
# box waits for that run before it builds them.
#
# THE VERDICT IS READ OFF THE STEPS, NOT THE RUN. A job's `gate` step writes the gate's exit code
# and passes; then `red` fails when the gate exited 1, and `no verdict` fails on any other code. So
# the train reads red only where a gate found the tree red, and a run that failed any other way (a
# runner lost, a cancel, a timeout, an install that failed, a gate that did not start) is no
# verdict, never a red tree.
#
# NO JOB HOLDS A SECRET. Only a push to a `gate/**` branch runs this, and only someone with write
# access to core can push one; a fork's push runs in the fork, and no pull request event is named
# here, so no pull request runs it. The token GitHub hands the jobs reads the repository and
# nothing else (`contents: read`), and the checkout does not keep it. The jobs push nothing: they
# read the public `bmabsout` Cachix as a plain substituter, which only publication.yml writes, and
# the Actions cache's store, which only gate-store.yml writes, from master.
#
# THE STORE. A run reads only the caches saved on its branch or on master, and a gate branch is
# new for every train, so each job restores the store gate-store.yml saves on master (or the
# newest one before it) and saves nothing. A miss is a cold store: slower, never red.
on:
  push:
    branches: [ 'gate/**' ]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}

jobs:
  # The lanes that read no build of the `builds` jobs, so they start at once.
  gate:
    name: gate (${{ matrix.lane }})
    # The box is aarch64, and no step of the half needs x86_64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      # Every lane runs to its own end, so one run names every red step.
      fail-fast: false
      matrix:
        include:
          - { lane: checks, steps: 'clippy,clippy-fixture,doc', part: '', builds: '', deps: true, wasm: optimised }
          - { lane: tests, steps: 'build,fence-plugin,test,test-fixture,plugin-fence,plugin-sync', part: '', builds: '', deps: true, wasm: optimised }
          - { lane: guards, steps: 'guards', part: '', builds: '', deps: true, wasm: optimised }
    steps: &lane
      # The runner's preinstalled toolchains, none of them used here, hold most of its disk, and
      # the gate does not start short of 12 GB.
      - &free
        name: Free the runner's disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache || true
          df -h /

      - &checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # Nix with flakes, reading the public Cachix as a plain substituter.
      - &nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            extra-substituters = https://bmabsout.cachix.org
            extra-trusted-public-keys = bmabsout.cachix.org-1:/GhCEayGQ3NHMIlJiUelQrLtHHXVdGjHtyDz32xNAo4=

      # The key is gate-store.yml's, spelled the same (a guard test holds the two equal).
      - &store
        name: the store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        continue-on-error: true
        with:
          primary-key: gate-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'app/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-prefixes-first-match: gate-store-${{ runner.os }}-${{ runner.arch }}-

      # The cargo lanes' dependency build (`matrix.deps`), which gate-store.yml keeps on master.
      - name: the dependency build
        if: matrix.deps
        continue-on-error: true
        uses: ./.github/actions/cargo-target
        with: { for: gate, mode: restore }

      # The builds this job waited for (`matrix.builds`), imported. A lane that finds none builds
      # what it reads itself: slower, never red.
      - name: the builds
        if: matrix.builds
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.builds }}
          path: ${{ runner.temp }}/builds

      # A cache's own paths are copied unsigned (the build job made them), with only the references
      # it lacks fetched first from the signed substituters, so one rule holds for every build;
      # each path is then checked valid, and a miss fails this step by name.
      - name: the builds, in the store
        if: matrix.builds
        continue-on-error: true
        run: |
          set -uo pipefail
          missed=0
          mapfile -t caches < <(find "$RUNNER_TEMP/builds" -name nix-cache-info -printf '%h\n')
          ((${#caches[@]})) || { echo "::error::no build was downloaded, so this lane builds what it reads itself"; exit 1; }
          for cache in "${caches[@]}"; do
            mapfile -t paths < <(nix path-info --store "file://$cache" --all)
            mapfile -t lacked < <(nix path-info --store "file://$cache" --json "${paths[@]}" |
              jq -r 'if type == "array" then .[] else to_entries[].value end | .references[]' | sort -u |
              grep -vxF -f <(printf '%s\n' "${paths[@]}"))
            if ((${#paths[@]})) && { ((${#lacked[@]} == 0)) || nix build --no-link "${lacked[@]}"; } &&
              nix copy --no-recursive --no-check-sigs --from "file://$cache" "${paths[@]}" &&
              nix path-info "${paths[@]}" >/dev/null; then
              echo "imported ${cache##*/}: ${#paths[@]} paths, and ${#lacked[@]} references from the substituters"
            else
              echo "::error::the build ${cache##*/} was not imported (above), so this lane builds what it held itself"
              missed=1
            fi
          done
          exit "$missed"

      # The passes the last gates kept (gate-passes.yml). The key names this run, which no entry
      # holds, so the newest one is read; a miss runs every step.
      - name: the passes
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: passes
          key: gate-passes-${{ github.run_id }}
          restore-keys: gate-passes-

      # Into the checkout's git directory, where the gate keeps them, and out of its tree, which must be HEAD's.
      - name: the passes, where the gate reads them
        run: if [ -d passes ]; then mv passes .git/gate; fi

      # The shell the gate runs in, apart, so a download that fails here stops the job before its
      # gate, as no verdict. A shell the tree cannot build is red on the box, whose public-tree
      # step builds it.
      - name: the shell
        run: nix develop .#triage -c true

      - id: gate
        name: gate
        env:
          STEPS: ${{ matrix.steps }}
          SUZATARY_E2E_PART: ${{ matrix.part }}
          SUZATARY_WASM: ${{ matrix.wasm }}
          SUZATARY_E2E_SHOTS: ${{ runner.temp }}/e2e-shots
        run: |
          code=0
          nix develop .#triage -c scripts/merge-gate.sh --no-live --steps "$STEPS" || code=$?
          echo "code=$code" >>"$GITHUB_OUTPUT"

      # A failed scene's screenshot, page and trace (web/e2e/harness.ts) are on the runner alone.
      - name: the failed scenes
        if: always() && steps.gate.outputs.code == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-scenes-${{ matrix.lane }}
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7

      # What this job's gate kept, for gate-passes.yml, whatever the verdict: a red step keeps no pass.
      - name: the passes kept
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passes-${{ matrix.lane }}
          path: .git/gate
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

      - name: red
        if: always() && steps.gate.outputs.code == '1'
        run: exit 1

      - name: no verdict
        if: always() && steps.gate.outputs.code != '0' && steps.gate.outputs.code != '1'
        env:
          CODE: ${{ steps.gate.outputs.code }}
        run: |
          echo "::error::the gate did not reach a verdict (exit ${CODE:-none}), which says nothing of the tree"
          exit 1

  # ONE BUILD PER TREE: each job builds the outputs `merge-gate.sh --list` names for it and hands
  # their closures, named by store path, to the lanes that read them as a binary cache in the run's
  # artifacts. A failed build is no verdict: each lane that reads it builds it, and is red there.
  build-web:
    name: build (web)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      matrix:
        include:
          - { build: web }
    steps: &build
      - *free
      - *checkout
      - *nix
      - *store
      - name: build
        env:
          BUILD: ${{ matrix.build }}
        run: |
          set -euo pipefail
          read -ra outputs <<<"$(scripts/merge-gate.sh --list | sed -n "s/^build $BUILD //p")"
          ((${#outputs[@]})) || { echo "::error::merge-gate.sh --list names no build $BUILD"; exit 1; }
          built="$(nix build --no-link --print-out-paths --print-build-logs "${outputs[@]/#/.#}")"
          mapfile -t paths <<<"$built"
          nix copy --to "file://$RUNNER_TEMP/build?compression=zstd" "${paths[@]}"
          du -sh "$RUNNER_TEMP/build"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.build }}
          path: ${{ runner.temp }}/build
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build-web-dev:
    name: build (web-dev)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      matrix:
        include:
          - { build: web-dev }
    steps: *build

  build-fixture:
    name: build (fixture)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      matrix:
        include:
          - { build: fixture }
    steps: *build

  # The lanes that read the builds: each waits for its builds' jobs to end, whatever they ended as.
  # The tests and the scenes read the development wasm build; the deploy's bundle (nix-web, which
  # judges its brotli budget) and the scenes that bound a task's time read the optimised one.
  gate-web:
    name: gate (${{ matrix.lane }})
    needs: build-web-dev
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: web, steps: 'web-inputs,web-test,build-web', part: '', builds: 'build-web-dev', deps: false, wasm: development }
    steps: *lane

  gate-e2e:
    name: gate (${{ matrix.lane }})
    needs: [build-web-dev, build-fixture]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each part runs web-inputs and build-web for e2e; scripts/e2e-part.sh deals the untimed
          # scenes to the parts and the timed ones to `timed`.
          - { lane: e2e-1, steps: 'web-inputs,build-web,e2e', part: '1/4', builds: 'build-*', deps: false, wasm: development }
          - { lane: e2e-2, steps: 'web-inputs,build-web,e2e', part: '2/4', builds: 'build-*', deps: false, wasm: development }
          - { lane: e2e-3, steps: 'web-inputs,build-web,e2e', part: '3/4', builds: 'build-*', deps: false, wasm: development }
          - { lane: e2e-4, steps: 'web-inputs,build-web,e2e', part: '4/4', builds: 'build-*', deps: false, wasm: development }
    steps: *lane

  # The deploy's bundle reads the optimised modules alone, so it waits for no fixture.
  gate-nix:
    name: gate (${{ matrix.lane }})
    needs: build-web
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: nix, steps: 'nix-web,nix-module,release-free', part: '', builds: 'build-web', deps: false, wasm: optimised }
    steps: *lane

  gate-timed:
    name: gate (${{ matrix.lane }})
    needs: [build-web, build-fixture]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: e2e-timed, steps: 'web-inputs,build-web,e2e', part: 'timed', builds: 'build-*', deps: false, wasm: optimised }
    steps: *lane
