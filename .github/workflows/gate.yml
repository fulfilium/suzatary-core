name: Gate

# THE MERGE GATE'S TREE HALF, ON GITHUB'S RUNNERS (scripts/train.sh gate --remote github). This
# file runs in suzatary-core, the public repository the train publishes to, where runners cost
# nothing. The train pushes one commit to a branch `gate/<train sha>`: the train commit's public
# tree, a function of its tree. Each job checks out that one commit (depth 1, so it reads the tree
# and no history) and runs one lane of scripts/merge-gate.sh's tree half with `--steps`; the steps
# that read the private repository run on the box (train.sh's `box_before` and `box_after`), and a
# guard test holds the lists to every step of the half. The train dispatches master's
# publication.yml for the same commit, which builds what a deploy builds beside these jobs, and the
# box waits for that run before it builds them.
#
# THE VERDICT IS READ OFF THE STEPS, NOT THE RUN. A job's `gate` step writes the gate's exit code
# and passes; then `red` fails when the gate exited 1, and `no verdict` fails on any other code. So
# the train reads red only where a gate found the tree red, and a run that failed any other way (a
# runner lost, a cancel, a timeout, an install that failed, a gate that did not start) is no
# verdict, never a red tree.
#
# NO JOB HOLDS A SECRET. Only a push to a `gate/**` branch runs this, and only someone with write
# access to core can push one; a fork's push runs in the fork, and no pull request event is named
# here, so no pull request runs it. The token GitHub hands the jobs reads the repository and
# nothing else (`contents: read`), and the checkout does not keep it. The jobs push nothing: they
# read the public `bmabsout` Cachix as a plain substituter, which only publication.yml writes, and
# the Actions cache's store, which only gate-store.yml writes, from master.
#
# THE STORE. A run on a branch reads only the caches saved on that branch or on master, and a
# gate branch is new for every train, so what a job saved here no later job could read. So each
# job restores the one store gate-store.yml saves on each push to master (the dependency builds
# no binary cache serves, keyed by what they are built from), or the newest one before it when
# the key moved, and saves nothing. A miss, or a restore that fails, leaves the job a cold store:
# slower, never red.
on:
  push:
    branches: [ 'gate/**' ]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}

jobs:
  gate:
    name: gate (${{ matrix.lane }})
    # The box is aarch64, and no step of the half needs x86_64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      # Every lane runs to its own end, so one run names every red step.
      fail-fast: false
      matrix:
        include:
          - { lane: checks, steps: 'clippy,clippy-fixture,doc', part: '' }
          - { lane: tests, steps: 'build,fence-plugin,test,test-fixture,plugin-fence,plugin-sync', part: '' }
          - { lane: guards, steps: 'guards', part: '' }
          - { lane: web, steps: 'web-inputs,web-test,build-web', part: '' }
          # e2e serves the bundle build-web writes from what web-inputs prepares, so each part
          # makes them again; scripts/e2e-part.sh deals the scenes to the parts.
          - { lane: e2e-1, steps: 'web-inputs,build-web,e2e', part: '1/4' }
          - { lane: e2e-2, steps: 'web-inputs,build-web,e2e', part: '2/4' }
          - { lane: e2e-3, steps: 'web-inputs,build-web,e2e', part: '3/4' }
          - { lane: e2e-4, steps: 'web-inputs,build-web,e2e', part: '4/4' }
          - { lane: nix, steps: 'nix-web,nix-module,release-free', part: '' }
    steps:
      # The runner's preinstalled toolchains, none of them used here, hold most of its disk, and
      # the gate does not start short of 12 GB.
      - name: Free the runner's disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache || true
          df -h /

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # The settings the gate's Codespace is made with (.devcontainer/devcontainer.json).
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            extra-substituters = https://bmabsout.cachix.org
            extra-trusted-public-keys = bmabsout.cachix.org-1:/GhCEayGQ3NHMIlJiUelQrLtHHXVdGjHtyDz32xNAo4=

      # The key is gate-store.yml's, spelled the same (a guard test holds the two equal).
      - name: the store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        continue-on-error: true
        with:
          primary-key: gate-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'app/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-prefixes-first-match: gate-store-${{ runner.os }}-${{ runner.arch }}-

      # The shell the gate runs in, apart, so a download that fails here stops the job before its
      # gate, as no verdict. A shell the tree cannot build is red on the box, whose public-tree
      # step builds it.
      - name: the shell
        run: nix develop .#triage -c true

      - id: gate
        name: gate
        env:
          STEPS: ${{ matrix.steps }}
          SUZATARY_E2E_PART: ${{ matrix.part }}
          SUZATARY_E2E_SHOTS: ${{ runner.temp }}/e2e-shots
        run: |
          code=0
          nix develop .#triage -c scripts/merge-gate.sh --no-live --steps "$STEPS" || code=$?
          echo "code=$code" >>"$GITHUB_OUTPUT"

      # A failed scene's screenshot, page and trace (web/e2e/harness.ts) are on the runner alone.
      - name: the failed scenes
        if: always() && steps.gate.outputs.code == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-scenes-${{ matrix.lane }}
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7

      - name: red
        if: always() && steps.gate.outputs.code == '1'
        run: exit 1

      - name: no verdict
        if: always() && steps.gate.outputs.code != '0' && steps.gate.outputs.code != '1'
        env:
          CODE: ${{ steps.gate.outputs.code }}
        run: |
          echo "::error::the gate did not reach a verdict (exit ${CODE:-none}), which says nothing of the tree"
          exit 1
