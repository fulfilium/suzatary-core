name: Quick checks

# THE PUSH-TIME OPINION, SIZED FOR A SMALL CHANGE: it checks every commit
# message (`plan`) and runs `check` (fmt, clippy, docs) against a restored
# dependency build; the suite and the browser are the merge gate's.
#
# A VERDICT IS KEPT: a `check` that already passed on exactly the git tree
# entries the Rust reads (`scripts/ci-names.sh`), in this workflow as it
# stands, is not run again; only a pass is kept, so a re-run of a failure runs.
#
# ONE SET OF FLAGS: `.github/cargo-ci.toml`, installed as cargo's
# configuration, so every cargo step builds on the step before.
on:
  push:
    branches: [ master ]
  # Not on pull requests: every train is gated again on the merged tree, so a run per push to
  # a PR branch only spends the private repository's minutes.
  workflow_dispatch: {}

concurrency:
  group: quick-${{ github.sha }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/app/target

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    outputs:
      rust: ${{ steps.name.outputs.rust }}
      check: ${{ steps.check.outputs.cache-hit }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # the commit-message check replays the whole pushed range
          persist-credentials: false

      - name: Every commit message is a claim about its diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="HEAD~5..HEAD"
          fi
          echo "checking $range"
          scripts/check-commits.sh "$range"

      - id: name
        name: Name the check job's inputs
        run: scripts/ci-names.sh | tee -a "$GITHUB_OUTPUT"

      - id: check
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: { path: .verdict, key: 'verdict-check-${{ steps.name.outputs.rust }}', lookup-only: true }

  check:
    needs: plan
    if: needs.plan.outputs.check != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#rust --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            max-jobs = auto
      - id: target
        uses: ./.github/actions/cargo-target
        with: { for: quick, mode: restore }

      - name: Format
        run: cargo fmt --manifest-path app/Cargo.toml --all --check

      # The `test = false` targets by name, since `--all-targets` leaves them out.
      - id: compile
        name: Clippy (pedantic, warnings denied, every target, fixture feature)
        # A public tree holds no live pins (`.gitattributes`).
        run: |
          live=$([ -f app/cli/tests/live.rs ] && echo --test live || true)
          cargo clippy --manifest-path app/Cargo.toml --workspace --all-targets \
            $live --test guards --test script-guards --test fence --test plugin \
            --features suzatary/fixture -- -D warnings

      - name: Docs (no broken or private links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path app/Cargo.toml --workspace --no-deps --features suzatary/fixture

      - if: always() && steps.compile.outcome == 'success'
        uses: ./.github/actions/cargo-target
        with: { for: quick, mode: save, hit: '${{ steps.target.outputs.hit }}' }

      - run: echo '${{ github.run_id }}' > .verdict
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: { path: .verdict, key: 'verdict-check-${{ needs.plan.outputs.rust }}' }
