# THE DEPLOY'S BUILDS, MADE ON GITHUB'S RUNNERS: for the box's system (aarch64-linux), what
# scripts/app-builds.sh builds from one public tree (the app, the web bundle and the plugins),
# pushed to the `bmabsout` Cachix the box substitutes from. A push to master builds that commit;
# the train dispatches master's copy with a gate commit as its input `commit`, and
# scripts/deploy.sh and scripts/train.sh wait, bounded, for that run (scripts/publication-run.sh,
# by the run-name), the box building itself when the run failed or never came.
#
# Left out: the operator's shell (`.#triage`), which holds an unfree package this cache must not
# redistribute, and the Android portal, whose build bakes in the box's name and Firebase project
# under --impure and is built in the private repository alone.
#
# WHO REACHES THE CACHE'S TOKEN. The code that reads the tree and the token are never in one job:
# `build` holds no environment and no secret and hands its paths on as an artifact; `push` enters
# the environment `cachix` on a fresh runner with master's checkout alone, and builds master's
# cachix before it reads anything the build made. So a build the tree compromises can choose what
# one push contains (at most 1 GB, in the paths the list names) and never holds the token. Only
# master's copy of this file holds it: the environment admits master alone
# (scripts/core-settings.sh), the jobs refuse any other ref and any run the owner did not start,
# and core's ruleset lets only an administrator move master, so no workflow a gate branch carries
# can run code of its own here. A pull request never runs it.
#
# WHAT REACHES THE CACHE. The privacy boundary is the leak guard the box runs before pushing to
# core (scripts/train.sh `checked`); scripts/public-source.sh, master's copy run on ./tree, is a
# tripwire on top that refuses a tree holding the private history (a file `.gitattributes` marks
# export-ignore). Every build is pure, so nothing of the deployment is read.
#
# THE ACTIONS CACHE. A run on master reads only the Actions caches saved on master, which
# gate-store.yml and any other job of a run on master could write; after the two jobs and the
# ruleset, planting an entry there takes an escape from Nix in a job that holds no token.
name: Publication cache
run-name: Publication cache ${{ inputs.commit || github.sha }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: The commit of suzatary-core to build, a full commit id
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/master' && github.triggering_actor == 'bmabsout' }}
    # The token reads this public repository and nothing else, since
    # install-nix-action writes it where any process on the runner can read it.
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      # The input reaches the shell through the environment alone, and anything
      # but a full commit id stops the job.
      - name: The commit
        id: commit
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the input commit is no full commit id"; exit 1; }
          echo "sha=$COMMIT" >>"$GITHUB_OUTPUT"

      # The builds need the room the runner's unused preinstalled toolchains take.
      - name: Free the runner's disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache || true
          df -h /

      # Master, whose steps and scripts run here.
      - name: Checkout master
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The tree to build, apart, so nothing of it runs as a step.
      - name: Checkout the tree to build
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          path: tree
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            accept-flake-config = false
            max-jobs = auto
            extra-substituters = https://bmabsout.cachix.org
            extra-trusted-public-keys = bmabsout.cachix.org-1:/GhCEayGQ3NHMIlJiUelQrLtHHXVdGjHtyDz32xNAo4=

      # The store gate-store.yml saves on master, restored and never saved; a
      # miss, or a restore that fails, builds from a cold store.
      - name: The gate's store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        continue-on-error: true
        with:
          primary-key: gate-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tree/flake.nix', 'tree/flake.lock', 'tree/app/Cargo.lock', 'tree/app/**/Cargo.toml') }}
          restore-prefixes-first-match: gate-store-${{ runner.os }}-${{ runner.arch }}-

      - name: The tree holds no private history
        run: scripts/public-source.sh tree

      # The box substitutes these because a checkout's store path is the path it fetches the commit
      # to. In ONE `nix build`, so the outputs build side by side; `--json` lists them in the order
      # asked, which the links rely on. Evaluation and sandboxed builds only: no `nix run` or
      # `nix develop` of the tree, no flake configuration of its own, and no lock file written, so
      # no input is locked from the runner's disk.
      - name: Build what a deploy builds and what the gate's live half reads
        run: |
          set -euo pipefail
          outputs=(bin=suzatary dist=suzatary-web plugins=suzatary-plugins
            live-suzatary-fixture=suzatary-fixture live-suzatary-web-ts=suzatary-web-ts
            live-suzatary-vector-json=suzatary-vector-json live-suzatary-wasm=suzatary-wasm
            live-suzatary-views-wasm=suzatary-views-wasm live-suzatary-typst-wasm=suzatary-typst-wasm
            live-suzatary-wasm-dev=suzatary-wasm-dev live-suzatary-views-wasm-dev=suzatary-views-wasm-dev)
          built="$(nix build --option accept-flake-config false --no-update-lock-file --print-build-logs --no-link --json "${outputs[@]/#*=/./tree#}")"
          mapfile -t paths < <(jq -r '.[].outputs.out' <<<"$built")
          ((${#paths[@]} == ${#outputs[@]})) || { echo "::error::nix build named ${#paths[@]} outputs for ${#outputs[@]} asked"; exit 1; }
          for i in "${!outputs[@]}"; do ln -sfn "${paths[i]}" "result-${outputs[i]%%=*}"; done

      # By NAR size (an upper bound of what Cachix stores): the cache holds 5 GB
      # and evicts the least recently used past it, the Prodrome's builds among
      # them, so a publication that would add more than 1 GB fails here.
      - name: Measure what the push adds
        env: &measure
          LIMIT: 1000000000
          UPSTREAM: https://cache.nixos.org
          CACHE: https://bmabsout.cachix.org
        run: |
          set -euo pipefail
          nix path-info --recursive ./result-bin ./result-dist ./result-plugins ./result-live-* | sort -u >closure.txt
          scripts/cache-unserved.sh closure closure.txt .

      # Each unserved path after what it refers to, with the served paths the
      # push job fetches first.
      - name: Export the unserved paths
        run: |
          set -euo pipefail
          mkdir -p publication
          nix-store --query --requisites ./result-bin ./result-dist ./result-plugins ./result-live-* | grep -Fx -f unserved.txt >publication/unserved.txt || true
          cp served.txt publication/served.txt
          if [[ -s publication/unserved.txt ]]; then
            mapfile -t paths <publication/unserved.txt
            nix-store --export "${paths[@]}" >publication/export.nar
          fi

      - name: Hand the paths to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication
          path: publication
          if-no-files-found: error
          retention-days: 1

  push:
    needs: build
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/master' && github.triggering_actor == 'bmabsout' }}
    # The token is this environment's secret, which only a run on master enters
    # (scripts/core-settings.sh), handed over when the job starts, so nothing
    # here reads or runs the tree.
    environment: cachix
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout master
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            accept-flake-config = false
            extra-substituters = https://bmabsout.cachix.org
            extra-trusted-public-keys = bmabsout.cachix.org-1:/GhCEayGQ3NHMIlJiUelQrLtHHXVdGjHtyDz32xNAo4=

      # cachix from master's pinned nixpkgs, built before anything the build
      # job made is in the store, so no import can stand in for a path of it.
      - name: Master's cachix
        run: nix build --inputs-from . --out-link cachix nixpkgs#cachix

      - name: The build job's paths
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication
          path: publication

      # The lists name store paths and nothing else; the served references
      # come from the two caches, their signatures checked, and only then is
      # the export imported, which needs them in the store.
      - name: Import the paths
        run: |
          set -euo pipefail
          touch publication/unserved.txt publication/served.txt
          ! grep -Evx '/nix/store/[0-9a-df-np-sv-z]{32}-[A-Za-z0-9+._?=-]+' publication/unserved.txt publication/served.txt \
            || { echo "::error::a list names something other than a store path"; exit 1; }
          xargs -r nix-store --realise <publication/served.txt >/dev/null
          if [[ -s publication/unserved.txt ]]; then
            nix-store --import <publication/export.nar >/dev/null
          fi

      # Again at push time, since another publication run may push a shared
      # path between the two measures (a concurrency group would only cancel or
      # delay a train's run).
      - name: Measure the push again
        env: *measure
        run: scripts/cache-unserved.sh list publication/unserved.txt push

      # Master's cachix pushes the paths measured above and nothing else.
      - name: Push the builds to the cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -s push/unserved.txt ]] || { echo "nothing to push: the cache serves every path the list names"; exit 0; }
          ./cachix-bin/bin/cachix push bmabsout <push/unserved.txt
          echo "pushed $(wc -l <push/unserved.txt) paths"
